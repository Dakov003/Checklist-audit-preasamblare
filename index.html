<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Audit Preasamblare</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ecran 1: start audit -->
<section id="ecran-start" class="ecran">
  <h1 class="titlu-app">Audit Preasamblare</h1>

  <div class="camp">
    <label for="input-aria">Aria</label>
    <input type="text" id="input-aria" autocomplete="off">
  </div>

  <div class="camp">
    <label for="input-masina">Nr. masina</label>
    <input type="text" id="input-masina" autocomplete="off">
  </div>

  <div class="camp">
    <label for="input-pn">PN</label>
    <input type="text" id="input-pn" autocomplete="off">
  </div>

  <div class="camp">
    <label>Schimb</label>
    <div class="grup-butoane" id="grup-schimb">
      <button type="button" class="buton-optiune" data-schimb="1">1</button>
      <button type="button" class="buton-optiune" data-schimb="2">2</button>
      <button type="button" class="buton-optiune" data-schimb="3">3</button>
    </div>
  </div>

  <div class="camp">
    <label for="input-auditor">Auditor</label>
    <input type="text" id="input-auditor" autocomplete="off">
  </div>

  <div class="camp">
    <label>Data si ora</label>
    <div id="data-ora-auto" class="text-auto"></div>
  </div>

  <button type="button" id="buton-incepe" class="buton-mare buton-principal">
    Incepe auditul
  </button>

  <button type="button" id="buton-continua" class="buton-mare buton-continua" hidden>
    Continua auditul din <span id="continua-ora"></span>
  </button>

  <button type="button" id="buton-audituri-salvate" class="buton-discret" hidden>
    Audituri salvate
  </button>
</section>

<!-- Ecran: audituri salvate -->
<section id="ecran-audituri-salvate" class="ecran" hidden>
  <h1 class="titlu-app">Audituri salvate</h1>
  <div id="lista-audituri"></div>
  <button type="button" id="buton-inapoi-audituri" class="buton-inapoi">
    &larr; Inapoi
  </button>
</section>

<!-- Ecran 2: parcurgerea checklistului -->
<section id="ecran-item" class="ecran" hidden>

  <div class="rand-sumar-acces">
    <button type="button" id="buton-sumar" class="buton-link-sumar">Sumar</button>
  </div>

  <div class="bara-progres-zona">
    <div class="bara-progres-fundal">
      <div class="bara-progres-umplere" id="bara-progres-umplere"></div>
    </div>
    <div class="contor-item" id="contor-item"></div>
  </div>

  <div class="nume-categorie" id="nume-categorie"></div>

  <div class="eticheta-risc" id="eticheta-risc"></div>

  <div class="text-cerinta" id="text-cerinta"></div>

  <div class="grup-status">
    <button type="button" id="buton-ok" class="buton-mare buton-status buton-ok">OK</button>
    <button type="button" id="buton-nok" class="buton-mare buton-status buton-nok">NOK</button>
    <button type="button" id="buton-na" class="buton-mare buton-status buton-na">N/A</button>
  </div>

  <!-- Formular NOK -->
  <div id="formular-nok" class="formular-extins" hidden>
    <div class="camp">
      <label for="nok-gasit">Ce ai gasit</label>
      <input type="text" id="nok-gasit" autocomplete="off">
    </div>
    <div class="camp">
      <label for="nok-actiune">Actiune imediata</label>
      <input type="text" id="nok-actiune" autocomplete="off">
    </div>
    <div class="camp">
      <label for="nok-actiune-necesara">Actiune necesara</label>
      <input type="text" id="nok-actiune-necesara" autocomplete="off">
    </div>
    <div class="camp">
      <label for="nok-responsabil">Responsabil</label>
      <input type="text" id="nok-responsabil" autocomplete="off">
    </div>
    <div class="camp">
      <label for="nok-termen">Termen</label>
      <input type="date" id="nok-termen">
    </div>
    <div class="camp">
      <label>Poze (maxim 3)</label>
      <div id="poze-preview" class="poze-preview"></div>
      <input type="file" id="input-poza" accept="image/*" capture="environment" hidden>
      <button type="button" id="buton-adauga-poza" class="buton-mare buton-continua">
        Adauga poza
      </button>
    </div>
    <button type="button" id="buton-salveaza-nok" class="buton-mare buton-principal">
      Salveaza si continua
    </button>
  </div>

  <!-- Formular N/A -->
  <div id="formular-na" class="formular-extins" hidden>
    <div class="camp">
      <label for="na-motiv">De ce nu se aplica</label>
      <input type="text" id="na-motiv" autocomplete="off">
    </div>
    <button type="button" id="buton-continua-na" class="buton-mare buton-principal">
      Continua
    </button>
  </div>

  <button type="button" id="buton-inapoi" class="buton-inapoi" aria-label="Itemul anterior">
    &larr; Item anterior
  </button>
</section>

<!-- Ecran 3: sumar si finalizare -->
<section id="ecran-sumar" class="ecran" hidden>
  <h1 class="titlu-app">Sumar audit</h1>

  <div class="verdict-mare" id="verdict-mare"></div>

  <div id="avertizare-necompletate" class="avertizare" hidden>
    <p id="text-avertizare-necompletate"></p>
    <button type="button" id="buton-sari-necompletat" class="buton-mare buton-principal">
      Mergi la primul necompletat
    </button>
  </div>

  <div class="bloc-contoare">
    <div class="rand-contor"><span>Total itemi</span><span id="contor-total"></span></div>
    <div class="rand-contor"><span>OK</span><span id="contor-ok"></span></div>
    <div class="rand-contor"><span>NOK</span><span id="contor-nok"></span></div>
    <div class="rand-contor"><span>N/A</span><span id="contor-na"></span></div>
    <div class="rand-contor"><span>Necompletati</span><span id="contor-necompletati"></span></div>
    <div class="rand-contor"><span>NOK critice</span><span id="contor-nok-critice"></span></div>
    <div class="rand-contor"><span>NOK major / minor</span><span id="contor-nok-major-minor"></span></div>
  </div>

  <h2 class="subtitlu-sumar">Defalcare pe categorii</h2>
  <div id="lista-categorii"></div>

  <h2 class="subtitlu-sumar">Itemi NOK</h2>
  <div id="lista-nok"></div>

  <h2 class="subtitlu-sumar">Semnatura</h2>
  <canvas id="canvas-semnatura" width="320" height="150"></canvas>
  <button type="button" id="buton-sterge-semnatura" class="buton-discret">
    Sterge semnatura
  </button>

  <button type="button" id="buton-inapoi-sumar" class="buton-inapoi">
    &larr; Inapoi la checklist
  </button>
</section>

<script src="app.js"></script>
</body>
</html>
